[project]
name = "recommender"
version = "0.1.0"
description = "Bite-sized knowledge recommender — daily batch (global pool, bandit reconcile, EMA user vector, metric rollup)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "qdrant-client>=1.10",
    "cryptography>=42.0",
]

[tool.uv]
package = false
