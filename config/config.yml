# config.yml

emb_model:
  path: https://zenodo.org/records/4905385/files/fasttext-ko-mini?download=1
  similarity_metric: cosine             # or: dot, euclidean

batch:
  user_filter_days: 7                    # 최근 7일간 활동 사용자
  min_interactions: 3                   # 최소 조회 수
  max_candidates: 200

logging:
  level: INFO
  log_path: /app/logs/reco.log
