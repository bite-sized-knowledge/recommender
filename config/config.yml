# recommender config — Phase 1+2

global_ranking:
  recency_days: 60                   # 발행 60일 이내 글만 풀 후보
  freshness_half_life_days: 14
  pool_size: 1000                    # 글로벌 풀 사이즈
  per_category_min: 30               # 각 카테고리 최소 N개 보장 (long-tail)
  popularity_window_days: 7
  weights:
    freshness: 0.4
    quality: 0.4
    popularity: 0.2

bandit:
  prior_alpha_onboarding: 4.0
  prior_beta_onboarding: 1.0
  prior_alpha_default: 1.0
  prior_beta_default: 2.0
  reward:
    article_in: 1.0
    like: 1.0
    archive: 1.0
    share: 2.0
    uninterest: -2.0
    impression_no_engagement_after_24h: -0.1
  reconcile_lookback_days: 30        # bandit reconcile 시 최근 N일 이벤트 사용

user_vector:
  enabled: true                       # Phase 2
  collection: user_profile
  vector_dim: 1024                    # Qwen3-Embedding-0.6B
  ema_decay: 0.95                     # weight per day
  min_clicks: 1                       # 최소 클릭 N개 이상인 유저만 빌드
  qdrant_batch: 256
  lookback_days: 90                   # 최근 N일 클릭만 EMA 입력

metric_rollup:
  lookback_days: 1                    # 어제 데이터로 일별 KPI rollup
  click_window_hours: 24              # impression 후 N시간 안 click 만 reward 인정

logging:
  level: INFO
  log_path: /app/logs/reco.log
